<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Dashboard</title>
<style>html, body { margin: 0; background: #0b0d18; }</style>
</head>
<body>
<script>
// Loader: TizenBrew pins this file to one version, so it fetches the latest dashboard straight
// from GitHub (refreshed every few minutes) and falls back to the copy shipped with this version.
(function () {
  var LIVE = 'https://raw.githubusercontent.com/Shivacore2201/tv-dashboard/main/app/dashboard.html';
  function show(html) { document.open(); document.write(html); document.close(); }
  function get(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true); x.timeout = 6000;
    x.onload = function () { if (x.status === 200 && x.responseText.indexOf('<html') !== -1) ok(x.responseText); else fail(); };
    x.onerror = x.ontimeout = fail;
    x.send();
  }
  get(LIVE + '?v=' + Math.floor(Date.now() / 300000), show, function () {
    get('dashboard.html', show, function () {
      document.body.innerHTML = '<p style="color:#fff;font:40px sans-serif;padding:80px">The dashboard could not load. Check the TV\'s internet connection.</p>';
    });
  });
})();
</script>
</body>
</html>
